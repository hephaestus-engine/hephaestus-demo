[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "durasum"
version = "0.1.0"
description = "Total the durations in a plain-text work log."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.16.8"]

[project.scripts]
durasum = "durasum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import the package from this checkout's src/, whatever copy of it
# is installed: a run's worktree is tested on its own code.
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]
# An xfail that starts passing fails the suite, so a fixed defect's marker
# cannot be forgotten.
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
